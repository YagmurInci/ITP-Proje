<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPro | Kurslarım</title>
    <link rel="stylesheet" href="my-courses.css">
</head>


<body>

    <div class="app-container">
        <aside class="sidebar">
            <div class="nav-brand">
                <img src="assets/EduProLogo.png" alt="Logo" style="width: 40px; height: 40px;"> EduPro
            </div>
            <nav class="nav-menu">
                <a href="home.html" class="nav-link"><span>🏠</span> Ana Sayfa</a>
                <a href="courses.html" class="nav-link"><span>📚</span> Tüm Kurslar</a>
                <a href="my-courses.html" class="nav-link active"><span>🎯</span> Kurslarım</a>
                <a href="instructors.html" class="nav-link"><span>👨‍🏫</span> Eğitmenler</a>
                <a href="profile.html" class="nav-link"><span>👤</span> Profil</a>
            </nav>

            <div style="margin-top: 100px;">
                <a href="index.html" class="nav-link" style="color: red;"><span>🚪</span> Çıkış Yap</a>
            </div>
        </aside>


        <main class="main-content">
            <!-- topbar: Arama çubuğu ve sayfa başlığı -->
            <header class="topbar">
                <div class="search-bar">
                    <span>🔍</span>
                    <input type="text" placeholder="Kurslarımda ara...">
                </div>
                <h1>Kurslarım</h1>
            </header>

            <!-- Kurs listesi bölümü -->
            <section class="content-area">
                <div class="flex flex-col gap2">
                    <!-- 1. Kurs Kartı (Yapay Zeka) -->
                    <div class="card flex" style="flex-direction: row; align-items: center; gap: 20px;">
                        <img src="assets/course1.png" alt="Course" style="width: 150px; height: 100px; object-fit: cover; border-radius: 12px;" >
                        <div style="flex:1;">
                            <!-- Kurs adı -->
                            <h3>Modern AI & Machine Learning</h3>
                            <!-- Eğitmen bilgisi -->
                            <p style="font-size: 16px; color: var(--text-muted); margin-bottom: 10px;">Eğitmen: Dr. Damla İnci</p>
                            <!-- Progress Bar: Dış kutu -->
                            <div 
                                style="background: var(--glass); border-radius: 8px; overflow: hidden;  height: 10px; width: 100%; margin-bottom: 10px;">
                                <!-- Progress Bar: İç dolgu (Mavi) -->
                                <div style="background: var(--primary); height: 100%; width: 65%; border-radius: 8px;"></div>
                                
                            </div>

                            <!-- Yüzdelik ve ders durumu metni -->
                             <div class="flex justify-between" style="font-size: 14px; color: var(--text-muted);">
                                <span>65% Tamamlandı</span>
                                <span>12/18 Ders</span>
                            </div>
                        </div>
                        <!-- Kursa devam etme butonu -->
                        <a href="#" class="btn btn-primary" style="padding: 0.8rem 1.5rem;">Devam Et</a>

                    </div>

                    <!-- 2. Kurs Kartı (Web Geliştirme) -->
                    <div class="card flex" style="flex-direction: row; align-items: center; gap: 20px;">
                        <img src="assets/web_dev.png" alt="Course" style="width: 150px; height: 100px; object-fit: cover; border-radius: 12px;" >
                        <div style="flex:1;">
                            <h3>Full-Stack Masterclass 2026</h3>
                            <p style="font-size: 16px; color: var(--text-muted); margin-bottom: 10px;">Eğitmen: Ayşe Demir</p>
                            <!-- İlerleme çubuğu -->
                            <div style="background: var(--glass); border-radius: 8px; overflow: hidden; height: 10px; width: 100%; margin-bottom: 10px;">
                                <div style="background: var(--primary); height: 100%; width: 20%; border-radius: 8px;"></div>
                            </div>
                            <!-- Durum bilgisi -->
                            <div class="flex justify-between" style="font-size: 14px; color: var(--text-muted);">
                                <span>20% Tamamlandı</span>
                                <span>4/20 Ders</span>
                            </div>
                        </div>
                            <!-- Kursa devam etme butonu -->
                            <a href="#" class="btn btn-primary" style="padding: 0.8rem 1.5rem;">Devam Et</a>
                        </div>
                    </div>
            </section>

        </main>
    </div>
</body>
</html>
